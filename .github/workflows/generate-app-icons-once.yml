name: Generate app icons once

on:
  push:
    branches:
      - app-icon-treasure-map

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-icon-treasure-map

      - name: Generate app icons and update references
        shell: bash
        run: |
          set -euo pipefail

          SRC="icons/86D5AF6F-6857-4581-B8FF-19737A01775D.png"
          MASTER="icons/app-icon.png"
          test -f "$SRC"
          mv "$SRC" "$MASTER"

          command -v convert >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y imagemagick; }

          convert "$MASTER" -filter Lanczos -resize 192x192! "icons/icon-192.png"
          convert "$MASTER" -filter Lanczos -resize 512x512! "icons/icon-512.png"
          convert "$MASTER" -filter Lanczos -resize 180x180! "icons/apple-touch-icon.png"
          convert "$MASTER" -filter Lanczos -resize 32x32! "icons/favicon-32x32.png"
          convert "$MASTER" -filter Lanczos -resize 16x16! "icons/favicon-16x16.png"

          convert -size 192x192 xc:'#35135f' \( "$MASTER" -filter Lanczos -resize 154x154! \) -gravity center -composite "icons/icon-maskable-192.png"
          convert -size 512x512 xc:'#35135f' \( "$MASTER" -filter Lanczos -resize 410x410! \) -gravity center -composite "icons/icon-maskable-512.png"

          rm -f icons/app-icon.svg

          python3 - <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path("manifest.webmanifest")
          manifest = json.loads(manifest_path.read_text())
          manifest["icons"] = [
              {"src":"icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"icons/icon-maskable-192.png","sizes":"192x192","type":"image/png","purpose":"maskable"},
              {"src":"icons/icon-maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          index = Path("index.html")
          text = index.read_text()
          text = text.replace(
              '<link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">',
              '<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">\n'
              '  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">\n'
              '  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">'
          )
          text = text.replace('styles.css?v=25', 'styles.css?v=26')
          text = text.replace('app.js?v=25', 'app.js?v=26')
          index.write_text(text)

          sw = Path("service-worker.js")
          text = sw.read_text()
          text = text.replace("const DEPLOYMENT_VERSION = '25';", "const DEPLOYMENT_VERSION = '26';")
          text = text.replace(
              "'./icons/app-icon.svg'",
              "'./icons/app-icon.png', './icons/icon-192.png', './icons/icon-512.png', "
              "'./icons/icon-maskable-192.png', './icons/icon-maskable-512.png', "
              "'./icons/apple-touch-icon.png', './icons/favicon-32x32.png', './icons/favicon-16x16.png'"
          )
          sw.write_text(text)
          PY

          rm -f .github/workflows/generate-app-icons-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace PWA icons with treasure map artwork"
          git push origin HEAD:app-icon-treasure-map
